# Settings of the LCA constraints (lca_constraints.py). Paths are relative to this file.
technologies: your_specific_input_files/technologies.csv  # output of the first notebook
scores: results/impact_scores.csv  # output of mescal
scores_direct: results/impact_scores_direct.csv  # output of mescal: direct emissions of the operation only
abbrev: generic_input_files/impact_abbrev.csv

# Yearly limits in the unit of the indicator: one value for all years, or one per year, e.g.:
#   LCA: {m_CCS_tot: 300.0e+9}                      total impacts (infrastructure + operation)
#   Infrastructure: {m_CCS_tot: {2050: 100.0e+9}}   construction and decommissioning
#   Operation: {}                                   operation and resources
#   Direct: {}                                      direct emissions of the operation
limits:
  LCA: {}
  Infrastructure: {}
  Operation: {}
  Direct: {m_CCS_tot: {2050: 0.0}}

pypsa_co2_limits: false  # false: removes the CO2 limits of PyPSA-Eur (co2_budget in its config) from the model

objective: cost  # or an indicator abbreviation, e.g., m_CCS_tot (impacts summed over all years)
